  </filter>
  <rect width="1280" height="720" fill="#15171c"></rect>
  <rect width="1280" height="720" filter="url(#poster-grano)"></rect>
  <g>
    <rect x="496" y="180" width="288" height="48" rx="4" fill="#2b2b2b"></rect>
    <rect x="562" y="336" width="222" height="48" rx="4" fill="#9a4535"></rect>
    <rect x="496" y="444" width="288" height="48" rx="4" fill="#2b2b2b"></rect>
  </g>
</svg>
