<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Tezontle 3D">
  <title>Tezontle 3D — video en preparación</title>
  <filter id="poster-grano">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="3" stitchTiles="stitch" result="ruido"></feTurbulence>
    <feColorMatrix
      in="ruido"
      type="matrix"
      values="0 0 0 0 0.549
              0 0 0 0 0.522
              0 0 0 0 0.482
              0 0 0 0.12 0"
